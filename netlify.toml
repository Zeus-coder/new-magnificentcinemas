[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires Node 20+; pin so Netlify does not fall back to an older default.
  NODE_VERSION = "22"

# The app uses BrowserRouter, so every path must be served index.html and let
# the client router resolve it. Without this, a direct hit or refresh on
# /movies returns Netlify's own 404 instead of the app's NotFound page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints everything in /assets, so those are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
